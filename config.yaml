# Mihomo 配置
# 名称：config.yaml
# 版本：2026-08-21
# 适用: Windows / Android

# 端口
port: 7890
socks-port: 7891
mixed-port: 7892
redir-port: 9797
tproxy-port: 9898

# 通用
ipv6: true
mode: rule
log-level: info
allow-lan: true
unified-delay: true
tcp-concurrent: true
find-process-mode: strict

# 面板
external-controller: 127.0.0.1:9090
external-ui: webui
external-ui-url: "https://github.com/Zephyruso/zashboard/releases/latest/download/dist.zip"

# 缓存
profile:
  store-selected: true
  store-fake-ip: true

# 嗅探
sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  override-destination: true
  sniff:
    HTTP:
      ports:
        - 80
        - 8080-8880
      override-destination: true
    TLS:
      ports:
        - 443
        - 8443
    QUIC:
      ports:
        - 443
        - 8443

# system/mixed/gvisor
tun:
  enable: true
  stack: mixed
  dns-hijack:
    - any:53
  auto-route: true
  auto-detect-interface: true
  strict-route: true

# redir-host/fake-ip
dns:
  enable: true
  prefer-h3: true
  listen: 0.0.0.0:1053
  ipv6: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - +.lan
    - +.local
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver:
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query

# 锚点：订阅参数
Proxy: &Proxy
  type: http
  interval: 21600
  health-check:
    enable: true
    url: "https://www.gstatic.com/generate_204"
    interval: 1800

# 订阅链接
proxy-providers:
  ONE:
    <<: *Proxy
    url: "订阅一"
    path: "./proxy_provider/One.yaml"

  TWO:
    <<: *Proxy
    url: "订阅二"
    path: "./proxy_provider/Two.yaml"

# 锚点：时延优选
UrlTest: &UrlTest
  type: url-test
  interval: 1800
  tolerance: 50
  lazy: true
  url: "https://www.gstatic.com/generate_204"
  disable-udp: false
  timeout: 2000
  max-failed-times: 3
  hidden: true

# 本地策略
proxies:
  - name: 直接连接
    type: direct
  - name: 拒绝连接
    type: reject

# 策略组
proxy-groups:
