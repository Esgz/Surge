# 锚点：规则类型
list: &list
  type: http
  interval: 86400
  timeout: 5000
  behavior: classical
  format: text

file: &file
  type: file
  behavior: classical
  format: text

# 远程规则
rule-providers:
  局域服务:
    <<: *list
    url: "https://raw.githubusercontent.com/Moli-X/Tool/X/Clash/Rules/Lan.list"
    path: "./RuleSet/Lan.list"

  直连服务:
    <<: *list
    url: "https://raw.githubusercontent.com/Esgz/rule/main/Direct.list"
    path: "./RuleSet/Direct.list"

  代理服务:
    <<: *list
    url: "https://raw.githubusercontent.com/Esgz/rule/main/Proxy.list"
    path: "./RuleSet/Proxy.list"

  拦截服务:
    <<: *list
    url: "https://raw.githubusercontent.com/Esgz/rule/main/Reject.list"
    path: "./RuleSet/Reject.list"

  影视追番:
