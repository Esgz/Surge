# 本地规则
rules:
  - RULE-SET,局域服务,直接连接
  - RULE-SET,直连服务,直接连接
  - RULE-SET,代理服务,全球服务
  - RULE-SET,拦截服务,拒绝连接
  - RULE-SET,影视追番,媒体服务
  - RULE-SET,媒体服务,媒体服务
  - RULE-SET,游戏服务,游戏服务
  - RULE-SET,苹果服务,苹果服务
  - RULE-SET,电报服务,电报服务
  - RULE-SET,谷歌服务,谷歌服务
  - RULE-SET,GitHub,全球服务
  - RULE-SET,微软服务,微软服务
  - RULE-SET,全球服务,全球服务
  - MATCH,大陆服务