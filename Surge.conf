[General]
udp-policy-not-supported-behaviour = REJECT // 不支持的 UDP 策略直接拒绝
dns-server = 223.5.5.5, 119.29.29.29
encrypted-dns-server = https://dns.alidns.com/dns-query, https://doh.pub/dns-query
use-local-host-item-for-proxy = false // 不使用本地 hosts
wifi-assist = false // Wi-Fi Assist
all-hybrid = true // 混合代理
udp-priority = true // UDP 流量优先
internet-test-url = http://connectivitycheck.platform.hicloud.com/generate_204 // 直连测试
proxy-test-url = http://www.gstatic.com/generate_204 // 代理测试
test-timeout = 3 // 测试超时时间
disable-geoip-db-auto-update = false // GeoIP 数据库更新
ipv6 = true // IPv6 开启
ipv6-vif = auto // IPv6 自动
allow-wifi-access = false // 禁止 Wi-Fi 局域网访问
allow-hotspot-access = false // 禁止热点共享访问
loglevel = warning // 日志等级
show-error-page-for-reject = true // 拒绝时显示错误页面
auto-suspend = true // 自动挂起未使用的连接
exclude-simple-hostnames = true // 排除简单主机名
http-api-tls = false // HTTP API 不启用 TLS
http-api-web-dashboard = false // 不启用 Web 控制面板

[Proxy]
直接连接 = direct
拒绝连接 = reject

[Proxy Group]
香港节点 = smart, no-alert=0, hidden=1, include-all-proxies=0, include-other-group=订阅节点, icon-url=https://raw.githubusercontent.com/Esgz/icon/main/HK.png, policy-regex-filter=(?i)🇭🇰|香港|HK

台湾节点 = smart, no-alert=0, hidden=1, include-all-proxies=0, include-other-group=订阅节点, icon-url=https://raw.githubusercontent.com/Esgz/icon/main/TW.png, policy-regex-filter=(?i)🇹🇼|台湾|TW

日本节点 = smart, no-alert=0, hidden=1, include-all-proxies=0, include-other-group=订阅节点, icon-url=https://raw.githubusercontent.com/Esgz/icon/main/JP.png, policy-regex-filter=(?i)🇯🇵|日本|JP

韩国节点 = smart, no-alert=0, hidden=1, include-all-proxies=0, include-other-group=订阅节点, icon-url=https://raw.githubusercontent.com/Esgz/icon/main/KR.png, policy-regex-filter=(?i)🇰🇷|韩国|KR

新国节点 = smart, no-alert=0, hidden=1, include-all-proxies=0, include-other-group=订阅节点, icon-url=https://raw.githubusercontent.com/Esgz/icon/main/SG.png, policy-regex-filter=(?i)🇸🇬|新加坡|SG

美国节点 = smart, no-alert=0, hidden=1, include-all-proxies=0, include-other-group=订阅节点, icon-url=https://raw.githubusercontent.com/Esgz/icon/main/US.png, policy-regex-filter=(?i)🇺🇸|美国|US


订阅节点 = select, no-alert=0, hidden=0, include-all-proxies=0, update-interval=21600, icon-url=https://raw.githubusercontent.com/Esgz/icon/main/Surge(11).png, policy-path=https://sub.store/download/collection/one?target=Surge

优选节点 = smart, no-alert=0, hidden=0, include-all-proxies=0, update-interval=21600, icon-url=https://raw.githubusercontent.com/Esgz/icon/main/Surge(9).png, policy-path=https://sub.store/download/collection/two?target=Surge

黑白名单 = select, 香港节点, 台湾节点, 日本节点, 韩国节点, 新国节点, 美国节点, 优选节点, 直接连接, no-alert=0, hidden=0, include-all-proxies=0, icon-url=https://raw.githubusercontent.com/Esgz/icon/main/Final.png

媒体服务 = select, 直接连接, 优选节点, 香港节点, 台湾节点, 日本节点, 韩国节点, 新国节点, 美国节点, no-alert=0, hidden=0, include-all-proxies=0, icon-url=https://raw.githubusercontent.com/Esgz/icon/main/Rex.png

[Rule]
RULE-SET,Emby.list,媒体服务
RULE-SET,https://raw.githubusercontent.com/Centralmatrix3/Matrix-io/master/Ruleset/Surge/ChinaASN.list,直接连接
FINAL,黑白名单,dns-failed

[MITM]
skip-server-cert-verify = true

h2 = true

ca-keystore-name = CA
