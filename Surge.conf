[General]
udp-policy-not-supported-behaviour = REJECT
dns-server = 223.5.5.5, 119.29.29.29
encrypted-dns-server = https://dns.alidns.com/dns-query, https://doh.pub/dns-query
use-local-host-item-for-proxy = false
wifi-assist = false
all-hybrid = true
udp-priority = true
internet-test-url = http://connectivitycheck.platform.hicloud.com/generate_204
proxy-test-url = http://www.gstatic.com/generate_204
test-timeout = 3
disable-geoip-db-auto-update = false
ipv6 = true
ipv6-vif = auto
allow-wifi-access = false
allow-hotspot-access = false
loglevel = warning
show-error-page-for-reject = true
auto-suspend = true
exclude-simple-hostnames = true
http-api-tls = false
http-api-web-dashboard = false

[Proxy]
直接连接 = direct
拒绝连接 = reject

[Proxy Group]
规则修正 = select, 直接连接, 香港节点, 台湾节点, 日本节点, 新国节点, 美国节点, no-alert=0, hidden=0, include-all-proxies=0, icon-url=https://raw.githubusercontent.com/Esgz/icon/refs/heads/main/Final.png

全球服务 = select, 香港节点, 台湾节点, 日本节点, 新国节点, 美国节点, 直接连接, no-alert=0, hidden=0, include-all-proxies=0, icon-url=https://raw.githubusercontent.com/Orz-3/mini/master/Color/Global.png

订阅节点 = select, no-alert=0, hidden=1, include-all-proxies=0, update-interval=21600, icon-url=https://raw.githubusercontent.com/Esgz/icon/refs/heads/main/Surge(8).png, policy-path=https://sub.store/download/collection/one?target=Surge

香港节点 = smart, no-alert=0, hidden=1, include-all-proxies=0, include-other-group=订阅节点, icon-url=https://raw.githubusercontent.com/Esgz/icon/refs/heads/main/HK.png, policy-regex-filter=(?i)🇭🇰|香港|HK

台湾节点 = smart, no-alert=0, hidden=1, include-all-proxies=0, include-other-group=订阅节点, icon-url=https://raw.githubusercontent.com/Esgz/icon/refs/heads/main/TW.png, policy-regex-filter=(?i)🇹🇼|台湾|TW

日本节点 = smart, no-alert=0, hidden=1, include-all-proxies=0, include-other-group=订阅节点, icon-url=https://raw.githubusercontent.com/Esgz/icon/refs/heads/main/JP.png, policy-regex-filter=(?i)🇯🇵|日本|JP

新国节点 = smart, no-alert=0, hidden=1, include-all-proxies=0, include-other-group=订阅节点, icon-url=https://raw.githubusercontent.com/Esgz/icon/refs/heads/main/SG.png, policy-regex-filter=(?i)🇸🇬|新加坡|SG

美国节点 = smart, no-alert=0, hidden=1, include-all-proxies=0, include-other-group=订阅节点, icon-url=https://raw.githubusercontent.com/Esgz/icon/refs/heads/main/US.png, policy-regex-filter=(?i)🇺🇸|美国|US

[Rule]
RULE-SET,Rules.list,规则修正
RULE-SET,https://raw.githubusercontent.com/Centralmatrix3/Matrix-io/master/Ruleset/Surge/ChinaASN.list,直接连接
FINAL,全球服务,dns-failed

[MITM]
skip-server-cert-verify = true

h2 = true

ca-keystore-name = CA
