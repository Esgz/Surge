[General]
udp-policy-not-supported-behaviour = REJECT // 不支持的 UDP 策略直接拒绝

dns-server = 223.5.5.5, 119.29.29.29

encrypted-dns-server = https://dns.alidns.com/dns-query, https://doh.pub/dns-query

encrypted-dns-follow-outbound-mode = false // 加密 DNS 通过策略执行

encrypted-dns-skip-cert-verification = false // 加密 DNS 跳过证书验证

use-local-host-item-for-proxy = false // 不使用本地 hosts

wifi-assist = false // Wi-Fi Assist

all-hybrid = true // 混合代理

udp-priority = true // UDP 流量优先

internet-test-url = http://connectivitycheck.platform.hicloud.com/generate_204 // 直连测试

proxy-test-url = http://www.gstatic.com/generate_204 // 代理测试

test-timeout = 3 // 测试超时时间

disable-geoip-db-auto-update = false // GeoIP 数据库更新

ipv6 = true // IPv6 开启

ipv6-vif = auto // IPv6 自动

allow-wifi-access = false // 禁止 Wi-Fi 局域网访问

allow-hotspot-access = false // 禁止热点共享访问

loglevel = warning // 日志等级

show-error-page-for-reject = true // 拒绝时显示错误页面

auto-suspend = true // 自动挂起未使用的连接

exclude-simple-hostnames = true // 排除简单主机名

http-api-tls = false // HTTP API 不启用 TLS

http-api-web-dashboard = false // 不启用 Web 控制面板

[Proxy]
直接连接 = direct
拒绝连接 = reject

[Proxy Group]
大陆服务 = select, 直接连接, 全球服务, no-alert=0, hidden=0, include-all-proxies=0, icon-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/China_Map.png

